services:
  - type: web
    name: bazarbeat
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: STORAGE_PROVIDER
        value: cloud
      - key: AI_GRADING_PROVIDER
        value: mock
      - key: AI_PRICE_PROVIDER
        value: mock
      - key: DEMO_MODE
        value: "false"
      - key: RATE_LIMIT_AUTH_PER_MIN
        value: "60"
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_DOMAIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
